<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detection Result</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        h1 { text-align: center; }
        .result-box { padding: 20px; border-radius: 6px; margin-top: 20px; }
        .safe { background-color: #e6ffe6; border: 1px solid #00cc00; color: #008000; }
        .phishing { background-color: #ffe6e6; border: 1px solid #cc0000; color: #cc0000; }
        p { font-size: 1.1em; }
        strong { font-weight: bold; }
        .back-link { display: block; margin-top: 30px; text-align: center; color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <h1>Detection Result</h1>
    
    <div class="result-box {% if result['is_phishing'] %}phishing{% else %}safe{% endif %}">
        <h2>Analyzed URL:</h2>
        <p><strong>{{ url }}</strong></p>
        
        <h2>Verdict:</h2>
        {% if result['is_phishing'] %}
            <p>🔴 **PHISHING** - Immediate action required!</p>
            <p>Reason: {{ result['reason'] }}</p>
        {% else %}
            <p>🟢 **SAFE (Rule-Based Pass)** - Proceed to ML Analysis.</p>
            <p>Detail: {{ result['reason'] }}</p>
        {% endif %}
    </div>

    <a href="/" class="back-link">← Test Another URL</a>
</body>
</html>
